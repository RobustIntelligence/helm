aiValidation:
  images:
    imagePullSecrets:
      - name: "ri-regcred"
    aiValidationImage:
      registry: "docker.io"
      name: "robustintelligencehq/ai-validation:2.12.11"
      pullPolicy: "Always"
    detectionEngineImage:
      registry: "docker.io"
      name: "robustintelligencehq/ri-firewall:2.12.11"
      pullPolicy: "Always"
  generativeValidationService:
    serviceAccount:
      annotations: {
        eks.amazonaws.com/role-arn: arn:aws:iam::565498894455:role/ai-defense-prod-ai-validation-generative-validation-irsa
      }

  metrics:
    enabled: true
    env_name: "prod"
    otel_remote_backend_grpc_port: "4317"
    cluster_name: "prod-ai-defence-us-west-2"
    namespace: "prod-validation"
    meter_name: "ai-validation-meter"
