aiValidation:
  verbose: true

  monitoring:
    enabled: true
    port: 8080

  images:
    imagePullSecrets:
      - name: "ri-regcred"
    aiValidationImage:
      registry: "docker.io"
      name: "robustintelligencehq/ai-validation:latest"
      # See https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
      pullPolicy: "Always"
    detectionEngineImage:
      registry: "docker.io"
      name: "robustintelligencehq/ri-firewall:2.12.3"
      pullPolicy: "Always"

  detectionServer:
    name: "detection-server"
    enabled: true
    port: 50053
    logLevel: info
    # Whether to enable the gRPC-gateway proxy for internal data platform usage.
    # We expose the detection server via REST on internal clusters only.
    # DO NOT ENABLE IN PRODUCTION.
    enableGrpcGateway: false
    # port for the gRPC-gateway proxy
    proxyPort: 15053
    service:
      type: ClusterIP
      annotations: {}
      labels: {}
    hpa:
      annotations: {}
      labels: {}
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
    pdb:
      enabled: true
      minAvailable: 1
    deployment:
      annotations: {}
      labels: {}
      replicaCount: 2
      serverResources:
        limits:
          memory: 3500Mi
        requests:
          cpu: 250m
          memory: 3500Mi
      # Resources for the gRPC-gateway proxy container.
      proxyResources:
        limits:
          memory: 100Mi
        requests:
          cpu: 10m
          memory: 100Mi

      # SecurityContext to add to the deployment. Default is just set to not run as root.
      # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#securitycontext-v1-core
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Extra env variables to add to the deployment. Make sure these don't
      # conflict with the ones already defined in the deployment.
      # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#envvar-v1-core
      extraEnv: []

      # Extra volumes to add to the deployment. Make sure these don't
      # conflict with the ones already defined in the deployment.
      # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#volumedevice-v1-core
      extraVolumes: []

      # Extra volume mounts to add to the deployment. Make sure these don't
      # conflict with the ones already defined in the deployment.
      # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#volumemount-v1-core
      extraVolumeMounts: []

      ## Node labels for pod assignment
      ## ref: https://kubernetes.io/docs/user-guide/node-selection/
      nodeSelector: {}

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "detection-server"

      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: dps

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node_group
                operator: In
                values:
                - dps
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "detection-server"
              topologyKey: topology.kubernetes.io/zone
            weight: 100
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "detection-server"
              topologyKey: kubernetes.io/hostname
            weight: 99

  generativeValidationService:
    enabled: true
    name: generative-validation-service
    port: 5040
    logLevel: info
    serviceAccount:
      create: true
      annotations: {}
    service:
      type: ClusterIP
    env:
      validationManagerGrpcEndpoint: "ai-defense-ai-validation-manager.default.svc.cluster.local:5555"
    hpa:
      annotations: {}
      labels: {}
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
    pdb:
      enabled: true
      minAvailable: 1
    deployment:
      environment: cloud
      # SecurityContext to add to the deployment. Default is just set to not run as root.
      # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#securitycontext-v1-core
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      replicaCount: 2
      resources:
        limits:
          memory: "1000Mi"
          cpu: "1000m"
        requests:
          memory: "1000Mi"
          cpu: "1000m"

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "generative-validation-service"

      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: dps

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node_group
                operator: In
                values:
                - dps
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "generative-validation-service"
              topologyKey: topology.kubernetes.io/zone
            weight: 100
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "generative-validation-service"
              topologyKey: kubernetes.io/hostname
            weight: 99
    networkPolicy:
      enabled: true
      egressExceptCIDR:
      - 10.0.0.0/8  #  Private network range - rfc1918
      - 192.168.0.0/16  #  Private network range - rfc1918
      - 127.0.0.1/32  #  localhost
      - 64.102.211.28/32  #  Cisco internal IPs allowed via SCI
      - 64.103.72.16/32  #  Cisco internal IPs allowed via SCI
      - 64.103.72.33/32  #  Cisco internal IPs allowed via SCI
      - 64.103.217.31/32  #  Cisco internal IPs allowed via SCI
      - 64.103.217.36/32  #  Cisco internal IPs allowed via SCI
      - 171.70.42.30/32  #  Cisco internal IPs allowed via SCI
      - 171.70.43.20/32  #  Cisco internal IPs allowed via SCI
      - 171.70.43.14/32  #  Cisco internal IPs allowed via SCI
      - 171.70.43.15/32  #  Cisco internal IPs allowed via SCI
      - 12.19.88.217/32  #  Cisco internal IPs allowed via SCI
      - 173.36.224.109/32  #  SCI default allowed http/https
      - 173.36.224.108/32  #  SCI default allowed http/https
      - 64.102.255.40/32  #  SCI default allowed http/https
      - 173.39.112.118/32  #  SCI default allowed http/https
      - 64.103.36.135/32  #  SCI default allowed http/https
      - 72.163.217.41/32  #  SCI default allowed http/https
      - 64.104.249.166/32  #  SCI default allowed http/https
      - 64.102.255.47/32  #  SCI default allowed http/https
      - 72.163.217.40/32  #  SCI default allowed http/https
      - 64.104.249.167/32  #  SCI default allowed http/https
      - 173.39.112.117/32  #  SCI default allowed http/https
    cpHostAddr: "localhost:8080"
  metrics:
    enabled: true
    env_name: "dev"
    otel_remote_backend_grpc_port: "4317"
    cluster_name: "dev-ai-defence-us-west-2"
    namespace: "sandbox-1-validation"
    meter_name: "ai-validation-meter"
