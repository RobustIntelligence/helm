aiValidation:
  images:
    imagePullSecrets:
      - name: "ri-regcred"
    aiValidationImage:
      registry: "docker.io"
      name: "robustintelligencehq/ai-validation:2.13.1"
      pullPolicy: "Always"
    detectionEngineImage:
      registry: "docker.io"
      name: "robustintelligencehq/ri-firewall:2.13.1"
      pullPolicy: "Always"
  generativeValidationService:
    serviceAccount:
      annotations: {
        eks.amazonaws.com/role-arn: arn:aws:iam::422940237045:role/ai-defense-stg-ai-validation-generative-validation-irsa
      }

  metrics:
    enabled: true
    env_name: "stg"
    otel_remote_backend_grpc_port: "4317"
    cluster_name: "stg-ai-defence-us-west-2"
    namespace: "stg-validation"
    meter_name: "ai-validation-meter"
