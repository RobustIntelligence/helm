{{- if .Values.aiValidation.generativeValidationService.enabled }}
{{- if .Values.aiValidation.generativeValidationService.serviceAccount.create}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-validation.generativeValidationService.serviceAccountName" . }}
  {{- if (gt (len .Values.aiValidation.generativeValidationService.serviceAccount.annotations) 0)}}
  annotations:
    {{- with .Values.aiValidation.generativeValidationService.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
