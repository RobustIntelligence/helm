{{- if .Values.aiValidation.generativeValidationService.enabled }}
{{- if .Values.aiValidation.generativeValidationService.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-validation-restricted-egress
spec:
  podSelector:
    matchLabels:
      {{- include "ai-validation.labels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- toYaml .Values.aiValidation.generativeValidationService.networkPolicy.egressExceptCIDR | nindent 8 }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
{{- end }}
{{- end }}
