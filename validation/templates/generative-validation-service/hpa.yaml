{{- if and .Values.aiValidation.generativeValidationService.enabled .Values.aiValidation.generativeValidationService.hpa.enabled }}
apiVersion: {{ include "ai-validation.hpa.apiVersion" . }}
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.aiValidation.generativeValidationService.name }}
  labels:
    app: {{ .Values.aiValidation.generativeValidationService.name }}
    {{- include "ai-validation.labels" . | nindent 4 }}
    {{- with .Values.aiValidation.generativeValidationService.hpa.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.aiValidation.generativeValidationService.name }}
  minReplicas: {{ .Values.aiValidation.generativeValidationService.hpa.minReplicas }}
  maxReplicas: {{ .Values.aiValidation.generativeValidationService.hpa.maxReplicas }}
  metrics:
{{ toYaml .Values.aiValidation.generativeValidationService.hpa.metrics | indent 4 }}
{{- end }}
