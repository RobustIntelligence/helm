{{- if .Values.hybridDeploymentApiKeySecret.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.hybridDeploymentApiKeySecret.name }}-manager-binding
subjects:
- kind: ServiceAccount
  name: {{ .Values.onpremGateway.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.hybridDeploymentApiKeySecret.name }}-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
