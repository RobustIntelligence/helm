rimeSystem:
  # -- Whether to install the Kubernetes Autoscaler Helm chart.
  # For full reference, see https://github.com/kubernetes/autoscaler/tree/cluster-autoscaler-1.26.6/cluster-autoscaler/cloudprovider
  clusterAutoscaler: false
  # -- Whether to install the ExternalDNS Helm chart.
  # For full reference, see https://github.com/kubernetes-sigs/external-dns/tree/v0.12.0/charts/external-dns
  externalDns: false
  # -- Whether to install the AWS Load Balancer Controller Helm chart.
  # For full reference, see https://github.com/kubernetes-sigs/aws-load-balancer-controller/tree/v2.5.4
  awsLoadBalancerController: false
  # -- Whether to install the Kubernetes Metrics Server Helm chart.
  # For full reference, see https://github.com/kubernetes-sigs/metrics-server/tree/v0.6.1
  metricsServer: false
  # -- Whether to install the ingress-nginx Helm chart.
  # For full reference, see See https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  ingressNginx: false
  # -- Whether to install the Kserve Helm chart.
  # For full reference, see See https://github.com/kserve/kserve
  kserve: false
  # -- Whether to install the Nvidia GPU Operator Helm chart.
  # For full reference, see https://github.com/NVIDIA/gpu-operator/tree/main
  nvidiaGpuOperator: false
# -- For full reference, see https://github.com/cert-manager/cert-manager/tree/v1.10.0
# @default -- (see individual values in `values`.yaml)
cert-manager:
  enabled: true
  installCRDs: true
  global:
    imagePullSecrets:
      - name: rimecreds
  image:
    registry: docker.io
    repository: robustintelligencehq/cert-manager-controller
    tag: "v1.10.0"
  webhook:
    image:
      registry: docker.io
      repository: robustintelligencehq/cert-manager-webhook
      tag: "v1.10.0"
  cainjector:
    image:
      registry: docker.io
      repository: robustintelligencehq/cert-manager-cainjector
      tag: "v1.10.0"
  startupapicheck:
    image:
      registry: docker.io
      repository: robustintelligencehq/cert-manager-ctl
      tag: "v1.10.0"
# -- For full reference, see https://github.com/NVIDIA/gpu-operator/tree/v24.6.2
# @default -- (see individual values in `values`.yaml)
nvidia-gpu-operator:
  daemonsets:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      # This is the taint we add to our GPU nodes.
      - key: dedicated
        operator: Equal
        value: gpu-dedicated
        effect: NoSchedule
  # Enables multi-instance GPU (MIG) support.
  migManager:
    enabled: false
  # Enables Data Center GPU Manager (DCGM) support.
  dcgm:
    enabled: false
  # Enables DCGM exporter support.
  dcgmExporter:
    enabled: false
  node-feature-discovery:
    worker:
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      # This is the taint we add to our GPU nodes.
      - key: dedicated
        operator: Equal
        value: gpu-dedicated
        effect: NoSchedule
  devicePlugin:
    config:
      # By default, we enable time-slicing and allow a GPU to be shared 5-ways.
      name: time-slicing-config
      create: true
      default: default
      data:
        default: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              renameByDefault: false
              resources:
              - name: nvidia.com/gpu
                replicas: 4

