# Value overrides created by the ri_firewall_helm_release Terraform module.
riFirewall:
  commonAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
    ad.datadoghq.com/tags: '{"user":"firewall-abx"}'
  secrets:
    existingIntegrationSecretsName: firewall-abx-secrets-terraform
    auth0Enabled: false
  ingress:
    ingressClassName: nginx
  images:
    backendImage:
      name: "robustintelligencehq/firewall-backend:2.12.0-rc.9"
      pullPolicy: "IfNotPresent"
    firewallServerImage:
      name: "robustintelligencehq/ri-firewall:2.12.0-rc.9"
      pullPolicy: "IfNotPresent"
    modelServerImage:
      name: "robustintelligencehq/firewall-model-server:2.12.0-rc.9"
      pullPolicy: "IfNotPresent"
      # Enable firewall instance ingress for preview for peerlinked snowflake access
  operator:
    firewallInstanceIngress:
      disabled: false # We want snowflake ingress in staging
  rimeFirewallDeployment:
    enabled: false
  firewallSystemConfig:
    enableHotfixYara: true
    validateResponseVisibilitySettings:
      ruleEvalMetadataVisibility:
        enableStdoutLogging: true
        enableApiResponse: true
      firewallRequestVisibility:
        enableStdoutLogging: true
        enableApiResponse: true
  hotfixYaraServer:
    autoUpdateEnabled: false
    ruleRepoRef: "main"
    yaraPatternUpdateFrequency: ""
  tracing:
    # -- Whether to enable OpenTelemetry tracing for all services on the Firewall
    enabled: true
    env_name: "preview"
    otel_remote_backend_grpc_port: "4317"
    cluster_name: "dev-ai-defence-us-west-2"
    namespace: "preview-runtime"
  registerFirewallAgent:
    enabled: true
    name: "register-firewall-agent-job"
    agentID: "a6e047eb-66d9-4456-90c7-9b6f4dd9908f"
    platformAddress: "https://rime.abx.rbst.io"
    agentURL: "firewall.abx.rbst.io"
    apiKey: "16a694a267fd2f993e4bcd9d4c36585f"
    backoffLimit: 2
    serviceAccount:
      create: true
      name: ""
      annotations: {}
      labels: {}
    job:
      labels: {}
      annotations: {}
      securityContext: {}
      resources:
        limits:
          memory: "100Mi"
        requests:
          memory: "100Mi"
          cpu: "100m"
  shimServer:
    name: "shim"
    ingress:
      enabled: false
    enabled: true

  firewallInstanceConfigs:
    # SA conservative release candidate for Secure Access
    - firewallServerImage: docker.io/robustintelligencehq/ri-firewall:2.12.0
      firewallBackendImage: docker.io/robustintelligencehq/firewall-backend:2.12.0
      modelServers:
        - name: prompt-injection-binary
          # This should only be non-empty for local minikube servers
          remoteModelServerAddress:
          huggingface_config:
            model_task: text-classification
            repository: robustintelligence/pi-modern-bert
            revision: 77e9349bde79ec2b725ad405e9bbcf401d736d93
            tokenizer_kwargs_json: '{"padding": true, "max_length": 512, "truncation": true}'
          classification_config:
            prompt_injection:
              default_sensitivity: RULE_SENSITIVITY_VERY_LOW
              fixed_threshold: null
              positive_class_index: 1
              sensitivity_based_thresholds:
                RULE_SENSITIVITY_HIGH: '0.1654206663'
                RULE_SENSITIVITY_LOW: '0.7847613692'
                RULE_SENSITIVITY_MEDIUM: '0.5519019365'
                RULE_SENSITIVITY_VERY_HIGH: '0.0391828306'
                RULE_SENSITIVITY_VERY_LOW: '0.9078367949'
          resourceConfig:
            limits:
              cpu: 5000m
              gpu: 2
              memory: 5000Mi
            max_replicas: 3
            min_replicas: 1
            requests:
              cpu: 1000m
              gpu: 2
              memory: 5000Mi
          modelServerImage: docker.io/robustintelligencehq/firewall-model-server-prompt-injection-binary:2.12.0
        - name: toxicity-intent-multi-label
          # This should only be non-empty for local minikube servers
          remoteModelServerAddress:
          huggingface_config:
            model_task: text-classification
            repository: robustintelligence/multi-label-toxicity-electra
            revision: a9ee2717192f3010a55da84c4b255e6a1e8d6617
            tokenizer_kwargs_json: '{"padding": true, "max_length": 512, "truncation": true}'
          classification_config:
            hate_speech:
              default_sensitivity: null
              fixed_threshold: '0.78'
              positive_class_index: 0
              sensitivity_based_thresholds: null
            harassment:
              default_sensitivity: null
              fixed_threshold: '0.75'
              positive_class_index: 1
              sensitivity_based_thresholds: null
            profanity:
