ingress-nginx:
  enabled: true
  controller:
    extraInitContainers: []
    maxmindLicenseKey: ""
    scope:
      enabled: true
      namespace: "stg-runtime"
    admissionWebhooks:
      enabled: false
    ingressClassResource:
      name: sf-ai-runtime
      controllerValue: k8s.io/sf-ai-runtime
    service:
      externalTrafficPolicy: Cluster
      enableHttp: false
      enableHttps: true
      targetPorts:
        http: http
        https: http
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: null
        service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=false
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: 80
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
        service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-west-2:422940237045:certificate/e74f7a0a-d9c7-4c86-ad30-995077d505f6
        service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
        service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    config:
      use-proxy-protocol: "false"
      allow-snippet-annotations: "false"
      use-geoip: "false"
      use-geoip2: "false"
      http-snippet: ""
