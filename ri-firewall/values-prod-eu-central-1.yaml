riFirewall:
  commonAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
    ad.datadoghq.com/tags: '{"user":"firewall-abx"}'

  secrets:
    existingIntegrationSecretsName: firewall-abx-secrets-terraform
    auth0Enabled: false

  productionOptimizations:
    overprovisionGPUNode:
      enabled: true
    overprovisionComputeNode:
      enabled: true

  images:
    backendImage:
      name: "robustintelligencehq/firewall-backend:2.14.3"
      pullPolicy: "IfNotPresent"
    firewallServerImage:
      name: "robustintelligencehq/ri-firewall:2.14.3"
      pullPolicy: "IfNotPresent"
    modelServerImage:
      name: "robustintelligencehq/firewall-model-server:2.14.3"
      pullPolicy: "IfNotPresent"

  rimeFirewallDeployment:
    enabled: false

  operator:
    firewallInstanceIngress:
      disabled: true
    firewallInstanceTemplate:
      hpa:
        minReplicas: 16
        maxReplicas: 100

  firewallSystemConfig:
    enableHotfixYara: true
    validateResponseVisibilitySettings:
      ruleEvalMetadataVisibility:
        enableStdoutLogging: true
        enableApiResponse: true
      firewallRequestVisibility:
        enableStdoutLogging: true
        enableApiResponse: true

  firewallInstanceConfigs:
    # SA conservative release candidate for Secure Access
    - firewallServerImage: docker.io/robustintelligencehq/ri-firewall:2.14.3
      firewallBackendImage: docker.io/robustintelligencehq/firewall-backend:2.14.3
      modelServers:
        - name: prompt-injection-binary
          # This should only be non-empty for local minikube servers
          remoteModelServerAddress:
          huggingface_config:
            model_task: text-classification
            repository: robustintelligence/pi-modern-bert
            revision: 77e9349bde79ec2b725ad405e9bbcf401d736d93
            tokenizer_kwargs_json: '{"padding": true, "max_length": 512, "truncation": true}'
          classification_config:
            prompt_injection:
              default_sensitivity: RULE_SENSITIVITY_VERY_LOW
              fixed_threshold: null
              positive_class_index: 1
              sensitivity_based_thresholds:
                RULE_SENSITIVITY_HIGH: '0.1654206663'
                RULE_SENSITIVITY_LOW: '0.7847613692'
                RULE_SENSITIVITY_MEDIUM: '0.5519019365'
                RULE_SENSITIVITY_VERY_HIGH: '0.0391828306'
                RULE_SENSITIVITY_VERY_LOW: '0.9078367949'
          resourceConfig:
            limits:
              cpu: 5000m
              gpu: 2
              memory: 5000Mi
            max_replicas: 25
            min_replicas: 12
            requests:
              cpu: 1000m
              gpu: 2
              memory: 5000Mi
          modelServerImage: docker.io/robustintelligencehq/firewall-model-server-prompt-injection-binary:2.14.3
        - name: toxicity-intent-multi-label
          # This should only be non-empty for local minikube servers
