# -- Ingress-nginx controller sub-chart. See https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx for all parameters.
# @default -- (see individual values in `values`.yaml)
ingress-nginx:
  enabled: false
  imagePullSecrets:
    - name: ri-regcred
  controller:
    image:
      registry: "docker.io"
      image: "robustintelligencehq/ingress-nginx-controller"
      tag: "v1.12.1"
      digest: "sha256:d2fbc4ec70d8aa2050dd91a91506e998765e86c96f32cffb56c503c9c34eed5b"
    extraVolumeMounts:
      - name: geoip
        mountPath: "/etc/ingress-controller/geoip/GeoLite2-Country.mmdb"
        subPath: GeoLite2-Country.mmdb
    extraVolumes:
      - name: geoip
        emptyDir: {}
    extraInitContainers:
      - name: download-geoip
        image: "robustintelligencehq/utility:1.0.0"
        command: ["/bin/sh", "-c"]
        args: ['aws s3api get-object --bucket geoip2-s3-storage-bucket --key GeoLite2-Country.mmdb GeoLite2-Country.mmdb && mv GeoLite2-Country.mmdb /home/GeoLite2-Country.mmdb']
        volumeMounts:
          - name: geoip
            mountPath: /home
    resources:
      requests:
        memory: "700Mi"
    scope:
      enabled: true
      # -- K8s namespace for the ingress
      namespace: ""
    ingressClassResource:
      enabled: true
      default: false
    admissionWebhooks:
      enabled: false
    service:
      externalTrafficPolicy: Local
      targetPorts:
        http: http
        https: http
      # -- For full list of annotations, see
      # https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.2/guide/service/annotations/
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: 80
      enableHttp: false
    metrics:
      # Enable Prometheus metrics by default for the ingress-nginx controller.
      # It is accessible on port 10254.
      enabled: true
    config:
      force-ssl-redirect: "false"
      ssl-redirect: "false"
      log-format-upstream: '{"msg": "nginx request log", "remote_addr": "$remote_addr", "request_method": "$request_method", "request_uri": "$request_uri", "status": $status, "body_bytes_sent": $body_bytes_sent, "request_time": $request_time, "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent", "upstream_service": "$upstream_addr", "upstream_response_length": $upstream_response_length, "upstream_response_time": $upstream_response_time, "upstream_status": $upstream_status}'
      use-proxy-protocol: "true"
      allow-snippet-annotations: "true"
      use-geoip: "false"
      use-geoip2: "true"
      # https://github.com/kubernetes/ingress-nginx/issues/12655
      annotations-risk-level: "Critical"
      http-snippet: |
        map $geoip2_country_code $allowed_country {
          default yes;
          IR no;
          CU no;
          SY no;
          KP no;
          UA no;
        }
    extraArgs:
      # https://kubernetes.github.io/ingress-nginx/user-guide/monitoring/#wildcard-ingresses
      # We use a "wildcard host" character so unless we use this option, no
      # metrics will be logged.
      # They disable it by default because the cardinality blows up quickly.
      metrics-per-host: "false"
      maxmind-edition-ids: GeoLite2-Country
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: "ingress-nginx"
    tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: dps
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node_group
                  operator: In
                  values:
                    - dps
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "ingress-nginx"
              topologyKey: topology.kubernetes.io/zone
            weight: 100
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "ingress-nginx"
              topologyKey: kubernetes.io/hostname
            weight: 99

valkey:
  enabled: false
