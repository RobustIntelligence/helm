{{- if and .Values.riFirewall.piiAnalyzer.enabled .Values.riFirewall.piiAnalyzer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.riFirewall.piiAnalyzer.name }}-serviceaccount
  {{- with .Values.riFirewall.piiAnalyzer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.riFirewall.piiAnalyzer.serviceAccount.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
