{{- if .Values.riFirewall.piiAnalyzer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.riFirewall.piiAnalyzer.name }}-deployment
  labels:
    app: {{ .Values.riFirewall.piiAnalyzer.name }}
    {{- with .Values.riFirewall.piiAnalyzer.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "ri-firewall.annotations" . | nindent 4 }}
    {{- with .Values.riFirewall.piiAnalyzer.deployment.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.riFirewall.piiAnalyzer.name }}
  replicas: {{ .Values.riFirewall.piiAnalyzer.deployment.replicaCount }}
  template:
    metadata:
      labels:
        app: {{ .Values.riFirewall.piiAnalyzer.name }}
        {{- with .Values.riFirewall.piiAnalyzer.deployment.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "ri-firewall.annotations" . | nindent 8 }}
        {{- with .Values.riFirewall.piiAnalyzer.deployment.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.riFirewall.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.riFirewall.piiAnalyzer.name }}-serviceaccount
      containers:
        - name: {{ .Values.riFirewall.piiAnalyzer.name }}
          image: "{{ .Values.riFirewall.images.firewallServerImage.registry}}/{{ .Values.riFirewall.images.firewallServerImage.name }}"
          imagePullPolicy: {{ .Values.riFirewall.images.firewallServerImage.pullPolicy }}
          readinessProbe:
            exec:
              command: [ "/bin/grpc_health_probe", "-addr=:{{ .Values.riFirewall.piiAnalyzer.port }}" ]
            periodSeconds: 5
          startupProbe:
            exec:
              command: [ "/bin/grpc_health_probe", "-addr=:{{ .Values.riFirewall.piiAnalyzer.port }}" ]
            failureThreshold: 60
            periodSeconds: 5
          ports:
            - name: grpc
              containerPort: {{ .Values.riFirewall.piiAnalyzer.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.riFirewall.piiAnalyzer.restPort }}
              protocol: TCP
          env:
            - name: RI_SERVICE_NAME
              value: {{ .Values.riFirewall.piiAnalyzer.name }}
          resources:
            {{- toYaml .Values.riFirewall.piiAnalyzer.deployment.resources | nindent 12 }}
          command:
            - "pii-analyzer"
          args:
            - "--port={{ .Values.riFirewall.piiAnalyzer.port }}"
            - "--max-workers={{ .Values.riFirewall.piiAnalyzer.deployment.maxWorkers }}"
      {{- with .Values.riFirewall.piiAnalyzer.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.riFirewall.piiAnalyzer.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.riFirewall.piiAnalyzer.deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
