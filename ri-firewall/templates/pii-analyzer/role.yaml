{{- if .Values.riFirewall.piiAnalyzer.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.riFirewall.piiAnalyzer.name }}-role
  labels:
    {{- with .Values.riFirewall.piiAnalyzer.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
{{- end }}
