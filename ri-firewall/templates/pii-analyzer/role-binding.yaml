{{- if .Values.riFirewall.piiAnalyzer.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.riFirewall.piiAnalyzer.name }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.riFirewall.piiAnalyzer.name }}-serviceaccount
subjects:
  - kind: ServiceAccount
    name: {{ .Values.riFirewall.piiAnalyzer.name }}-role
{{- end }}
