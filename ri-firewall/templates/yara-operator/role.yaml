{{- if .Values.riFirewall.yaraOperator.serviceAccount.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ri-firewall.fullname" . }}-{{ .Values.riFirewall.yaraOperator.name }}-role
  namespace: '{{.Release.Namespace}}'
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fw.rbst.io
  resources:
  - yaraservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fw.rbst.io
  resources:
  - yaraservers/finalizers
  verbs:
  - update
- apiGroups:
  - fw.rbst.io
  resources:
  - yaraservers/status
  verbs:
  - get
  - patch
  - update
{{- end }}
